spring:
  application:
    name: rhb-assessment
  datasource:
    url: jdbc:h2:mem:rhbdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    open-in-view: false
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console

external-api:
  base-url: https://www.google.com
  connect-timeout-ms: 3000
  read-timeout-ms: 5000

logging:
  level:
    com.shihab.rhbaccess.logging: INFO
